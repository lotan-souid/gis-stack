# MapStore GeoStore datasource override — PostgreSQL/PostGIS backend.
#
# Switches MapStore's internal GeoStore database from the default embedded H2
# to the PostGIS service in this stack (recommended for production; H2 is not).
#
# IMPORTANT: the connection values below must match the PostGIS credentials in
# your .env (POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD). The defaults here
# mirror .env.example — change them together, and use real secrets only in .env
# and a matching private copy of this file (never commit production secrets).

geostoreDataSource.driverClassName=org.postgresql.Driver
geostoreDataSource.url=jdbc:postgresql://postgis:5432/gisdb
geostoreDataSource.username=gisadmin
geostoreDataSource.password=postgress_password

# Let GeoStore create/update its own tables on first start.
geostoreEntityManagerFactory.jpaPropertyMap[hibernate.hbm2ddl.auto]=update
geostoreEntityManagerFactory.jpaPropertyMap[hibernate.dialect]=org.hibernate.dialect.PostgreSQLDialect
