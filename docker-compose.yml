# GIS Stack — docker-compose.yml
# Version: 8.0.0  (keep in sync with VERSION; see README "Versioning")

x-gis-stack-version: "8.0.0"

# Settings shared by every service (merged with `<<: *common`).
x-common: &common
  restart: unless-stopped
  networks:
    - gis-network
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Read-only connection used by the tile/feature servers (see postgis-init).
x-reader-db-url: &reader-db-url "postgres://${GIS_READER_USER}:${GIS_READER_PASSWORD:?set GIS_READER_PASSWORD}@postgis:5432/${POSTGRES_DB}"

# Wait until postgis-init has created the roles/databases.
x-depends-on-db: &depends-on-db
  postgis-init:
    condition: service_completed_successfully

services:
  # ---------------------------------------------------------------- data layer
  postgis:
    <<: *common
    image: postgis/postgis:${POSTGIS_VERSION}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${POSTGIS_PORT}:5432"
    volumes:
      - ${DATA_DIR:-./data}/postgis:/var/lib/postgresql/data:Z
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    healthcheck:
      # -h localhost: only report ready once the real server accepts TCP,
      # not while the first-run init server is up on the unix socket.
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 10s
      retries: 6
      timeout: 5s
      start_period: 30s

  # One-shot job, runs on every `up`: creates the read-only role and the
  # GeoStore database. Idempotent — safe on new and existing databases.
  postgis-init:
    <<: *common
    image: postgis/postgis:${POSTGIS_VERSION}
    restart: "no"
    entrypoint: ["sh", "/bootstrap/bootstrap.sh"]
    volumes:
      - ./config/postgis:/bootstrap:ro
    # The image declares VOLUME /var/lib/postgresql/data; this job never uses
    # it, so a tmpfs stops Docker creating an anonymous volume.
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      GIS_READER_USER: "${GIS_READER_USER}"
      GIS_READER_PASSWORD: "${GIS_READER_PASSWORD}"
      GEOSTORE_DB: "${GEOSTORE_DB}"
      GEOSTORE_USER: "${GEOSTORE_USER}"
      GEOSTORE_PASSWORD: "${GEOSTORE_PASSWORD:?set GEOSTORE_PASSWORD}"
    depends_on:
      postgis:
        condition: service_healthy

  pgadmin:
    <<: *common
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD}"
      # Accept home-lab login emails such as admin@gis.local (rejected by default).
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local', 'lan', 'home.arpa']"
    volumes:
      - ${DATA_DIR:-./data}/pgadmin:/var/lib/pgadmin
    depends_on:
      postgis:
        condition: service_healthy

  # ------------------------------------------------------ OGC / API services
  geoserver:
    <<: *common
    image: docker.osgeo.org/geoserver:${GEOSERVER_VERSION}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${GEOSERVER_PORT}:8080"
    volumes:
      - ${DATA_DIR:-./data}/geoserver:/opt/geoserver_data/:Z
    environment:
      ROOT_WEBAPP_REDIRECT: "true"
      GEOSERVER_ADMIN_USER: "${GEOSERVER_ADMIN_USER}"
      GEOSERVER_ADMIN_PASSWORD: "${GEOSERVER_ADMIN_PASSWORD:?set GEOSERVER_ADMIN_PASSWORD}"
      INITIAL_MEMORY: "${GEOSERVER_INITIAL_MEMORY:-1G}"
      MAXIMUM_MEMORY: "${GEOSERVER_MAX_MEMORY:-2G}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png || exit 1"]
      interval: 1m
      retries: 3
      timeout: 20s
      start_period: 2m

  pygeoapi:
    <<: *common
    image: geopython/pygeoapi:${PYGEOAPI_VERSION}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PYGEOAPI_PORT}:80"
    environment:
      PYGEOAPI_CONFIG: /pygeoapi/config/config.yml
      PYGEOAPI_SERVER_URL: "${PYGEOAPI_SERVER_URL:-http://localhost:${PYGEOAPI_PORT}}"
      # Available to config.yml as ${...} for PostgreSQL resources.
      POSTGRES_DB: "${POSTGRES_DB}"
      GIS_READER_USER: "${GIS_READER_USER}"
      GIS_READER_PASSWORD: "${GIS_READER_PASSWORD}"
    volumes:
      - ./config/pygeoapi:/pygeoapi/config:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/conformance', timeout=5)"]
      interval: 1m
      retries: 3
      timeout: 10s
      start_period: 1m
    depends_on: *depends-on-db

  # ------------------------------------------------- tile & feature servers
  pg_tileserv:
    <<: *common
    image: pramsey/pg_tileserv:${PG_TILESERV_VERSION}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PG_TILESERV_PORT}:7800"
    environment:
      DATABASE_URL: *reader-db-url
    # Image declares VOLUME /config (empty; settings come from env).
    tmpfs:
      - /config
    depends_on: *depends-on-db

  pg_featureserv:
    <<: *common
    image: pramsey/pg_featureserv:${PG_FEATURESERV_VERSION}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PG_FEATURESERV_PORT}:9000"
    environment:
      DATABASE_URL: *reader-db-url
    # Image declares VOLUME /config (empty) and /assets (HTML templates).
    tmpfs:
      - /config
    volumes:
      - pg-featureserv-assets:/assets
    depends_on: *depends-on-db

  martin:
    <<: *common
    image: ghcr.io/maplibre/martin:${MARTIN_VERSION}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${MARTIN_PORT}:3000"
    environment:
      DATABASE_URL: *reader-db-url
    depends_on: *depends-on-db

  tileserver-gl:
    <<: *common
    profiles: ["basemaps"]
    image: maptiler/tileserver-gl:${TILESERVER_VERSION}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${TILESERVER_PORT}:8080"
    volumes:
      - ${DATA_DIR:-./data}/tileserver-gl:/data

  # ---------------------------------------------------- client & utilities
  mapstore:
    <<: *common
    image: geosolutionsit/mapstore2:${MAPSTORE_VERSION}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${MAPSTORE_PORT}:8080"
    environment:
      # Replaces the image's JAVA_OPTS, so the heap and data dir are restated.
      JAVA_OPTS: >-
        -Xms512m -Xmx${MAPSTORE_MAX_MEMORY:-1g}
        -Dgeostore-ovr=file:///usr/local/tomcat/conf/geostore-datasource-ovr.properties
        -Ddatadir.location=/usr/local/tomcat/datadir
      GEOSTORE_DB: "${GEOSTORE_DB}"
      GEOSTORE_USER: "${GEOSTORE_USER}"
      GEOSTORE_PASSWORD: "${GEOSTORE_PASSWORD}"
      MAPSTORE_ADMIN_USER: "${MAPSTORE_ADMIN_USER}"
      MAPSTORE_ADMIN_PASSWORD: "${MAPSTORE_ADMIN_PASSWORD:?set MAPSTORE_ADMIN_PASSWORD}"
    # Render the GeoStore datasource override and initial admin from env vars,
    # then start Tomcat. GeoStore creates the admin only while its user table is
    # empty (first start); later password changes are made in the MapStore UI.
    command:
      - sh
      - -c
      - |
        cat > /usr/local/tomcat/conf/geostore-users.xml <<EOF
        <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
        <InitUserList>
            <User>
                <name>$$MAPSTORE_ADMIN_USER</name>
                <newPassword>$$MAPSTORE_ADMIN_PASSWORD</newPassword>
                <role>ADMIN</role>
            </User>
        </InitUserList>
        EOF
        cat > /usr/local/tomcat/conf/geostore-datasource-ovr.properties <<EOF
        geostoreDataSource.driverClassName=org.postgresql.Driver
        geostoreDataSource.url=jdbc:postgresql://postgis:5432/$$GEOSTORE_DB
        geostoreDataSource.username=$$GEOSTORE_USER
        geostoreDataSource.password=$$GEOSTORE_PASSWORD
        geostoreEntityManagerFactory.jpaPropertyMap[hibernate.hbm2ddl.auto]=update
        geostoreEntityManagerFactory.jpaPropertyMap[hibernate.dialect]=org.hibernate.dialect.PostgreSQLDialect
        geostoreInitializer.userListInitFile=file:/usr/local/tomcat/conf/geostore-users.xml
        EOF
        exec catalina.sh run
    volumes:
      - mapstore-datadir:/usr/local/tomcat/datadir
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null http://localhost:8080/mapstore/ || exit 1"]
      interval: 1m
      retries: 3
      timeout: 20s
      start_period: 2m
    depends_on: *depends-on-db

  solr:
    <<: *common
    profiles: ["search"]
    image: solr:${SOLR_VERSION}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${SOLR_PORT}:8983"
    environment:
      SOLR_HEAP: "${SOLR_HEAP:-512m}"
    volumes:
      - ${DATA_DIR:-./data}/solr:/var/solr
    # Uses Solr's built-in _default configset.
    command: ["solr-precreate", "blacklight-core"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8983/solr/admin/cores?action=STATUS || exit 1"]
      interval: 1m
      retries: 3
      timeout: 10s

volumes:
  # Named volume: initialised with the image's ownership (Tomcat runs as UID 20000).
  # Fixed name, independent of the Compose project / Portainer stack name.
  mapstore-datadir:
    name: gis-stack-mapstore-datadir
  # pg_featureserv's HTML templates, copied from the image on first use.
  # Delete this volume after upgrading pg_featureserv to pick up new templates.
  pg-featureserv-assets:
    name: gis-stack-pg-featureserv-assets

networks:
  gis-network:
    driver: bridge
