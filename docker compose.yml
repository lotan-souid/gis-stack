version: '3.8'

services:
  geoserver:
    image: docker.osgeo.org/geoserver:${GEOSERVER_VERSION}
    ports:
      - "${GEOSERVER_PORT}:8080"
    volumes:
      - ./data/geoserver:/opt/geoserver_data/:Z
    environment:
      ROOT_WEBAPP_REDIRECT: "true"
      GEOSERVER_ADMIN_USER: "${GEOSERVER_ADMIN_USER}"
      GEOSERVER_ADMIN_PASSWORD: "${GEOSERVER_ADMIN_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png || exit 1"]
      interval: 1m
      retries: 3
      timeout: 20s
    restart: unless-stopped
    networks:
      - gis-network

  mapstore:
    image: geosolutionsit/mapstore2:${MAPSTORE_VERSION}
    ports:
      - "${MAPSTORE_PORT}:8080"
    volumes:
      - ./config/geostore-datasource-ovr-postgres.properties:/usr/local/tomcat/conf/geostore-datasource-ovr.properties
    environment:
      JAVA_OPTS: "-Dgeostore-ovr=file:///usr/local/tomcat/conf/geostore-datasource-ovr.properties"
    depends_on:
      - postgis
    restart: unless-stopped
    networks:
      - gis-network

  postgis:
    image: postgis/postgis:${POSTGIS_VERSION}
    ports:
      - "${POSTGIS_PORT}:5432"
    volumes:
      - ./data/postgis:/var/lib/postgresql/data:Z
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} || exit 1"]
      interval: 1m
      retries: 3
      timeout: 20s
    restart: unless-stopped
    networks:
      - gis-network

  solr:
    image: solr:${SOLR_VERSION}
    ports:
      - "${SOLR_PORT}:8983"
    volumes:
      - ./data/solr:/var/solr
      - ./solr_conf:/solr_conf
    command:
      - solr-precreate
      - blacklight-core
      - /solr_conf
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8983/solr/admin/cores?action=STATUS || exit 1"]
      interval: 1m
      retries: 3
      timeout: 10s
    restart: unless-stopped
    networks:
      - gis-network

  pg_tileserv:
    image: pramsey/pg_tileserv:${PG_TILESERV_VERSION}
    ports:
      - "${PG_TILESERV_PORT}:7800"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB}"
    depends_on:
      - postgis
    restart: unless-stopped
    networks:
      - gis-network

  pg_featureserv:
    image: pramsey/pg_featureserv:${PG_FEATURESERV_VERSION}
    ports:
      - "${PG_FEATURESERV_PORT}:9000"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB}"
    depends_on:
      - postgis
    restart: unless-stopped
    networks:
      - gis-network

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    ports:
      - "${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgis
    restart: unless-stopped
    networks:
      - gis-network

  tileserver-gl:
    image: maptiler/tileserver-gl:${TILESERVER_VERSION}
    ports:
      - "${TILESERVER_PORT}:80"
    volumes:
      - ./data/tileserver-gl:/data
    restart: unless-stopped
    networks:
      - gis-network

networks:
  gis-network:
    driver: bridge
